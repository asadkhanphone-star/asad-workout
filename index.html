html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:15px}

.home-h1{font-size:1.75rem;font-weight:800;line-height:1.1}

.home-meta{font-size:.65rem;color:var(--muted);margin-top:.3rem}
.home-week-bar{display:flex;align-items:center;justify-content:center;gap:.75rem;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:.65rem 1rem;margin:.75rem 1rem 0}
.hw-label{font-size:.7rem;font-weight:600;color:var(--muted)}

.hw-btn:active{background:var(--border)}

.days-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;padding:.9rem}
.day-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.85rem;text-align:left;cursor:pointer;border-left-width:4px;min-height:75px;display:flex;flex-direction:column;gap:3px}

.install-banner.show{display:flex}

    icons:[{src:"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="32" fill="#0a0f1a"/><text x="96" y="130" text-anchor="middle" font-size="100">🏋️</text></svg>'),sizes:"192x192",type:"image/svg+xml",purpose:"any maskable"},
           {src:"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="80" fill="#0a0f1a"/><text x="256" y="345" text-anchor="middle" font-size="280">🏋️</text></svg>'),sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};
  const l=document.createElement('link');l.rel='manifest';
  l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
  document.head.appendChild(l);
})();
if('serviceWorker' in navigator){
  const sw=`self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(clients.claim()));self.addEventListener('fetch',e=>e.respondWith(fetch(e.request).catch(()=>new Response(''))));`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))).catch(()=>{});
}
let dPr=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dPr=e;if(!localStorage.getItem('pwa_ok'))document.getElementById('installBanner').classList.add('show');});
document.getElementById('installBtn').onclick=async()=>{if(!dPr)return;dPr.prompt();const{outcome}=await dPr.userChoice;if(outcome==='accepted'){localStorage.setItem('pwa_ok','1');document.getElementById('installBanner').classList.remove('show');}dPr=null;};
window.addEventListener('appinstalled',()=>{localStorage.setItem('pwa_ok','1');document.getElementById('installBanner').classList.remove('show');});

};
function calcWeight(n,w){
  const k=Object.keys(WD).find(k=>n.toLowerCase().includes(k.toLowerCase())||k.toLowerCase().includes(n.toLowerCase().split(' ').slice(0,3).join(' ')));
  const d=k?WD[k]:undefined;
  if(d==='stretch')return{type:'stretch'};if(d===null)return{type:'bodyweight'};if(!d)return null;
  let inc=w<=20?Math.floor((w-1)/2):Math.floor(19/2)+Math.floor((w-20)/3);
  let wt=Math.min(d.s+inc*d.i,d.m);wt=Math.round(wt*4)/4;
  const pct=Math.round((wt-d.s)/(d.m-d.s)*100);
  return{type:'weighted',weight:wt,unit:d.u,max:d.m,pct:Math.max(0,Math.min(100,pct||0))};
}
let currentWeek=parseInt(localStorage.getItem('asad_week')||'1');
function adjWeek(delta){currentWeek=Math.max(1,Math.min(52,currentWeek+delta));localStorage.setItem('asad_week',currentWeek);render();}

// ─── APP STATE ────────────────────────────────────────────────────────────────
let S={screen:'home',day:null,exIdx:0,setNum:1,timeLeft:0,timerOn:false,timerDone:false,iv:null};
const fmt=s=>`${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
function go(p){if(S.iv&&(p.screen||p.exIdx!=null))clearInterval(S.iv);Object.assign(S,p);render();}
function startDay(d){if(S.iv)clearInterval(S.iv);S={screen:d.type==='rest'?'restday':d.type==='yoga'?'yoga':d.treadmill?'treadmill':'warmup',day:d,exIdx:0,setNum:1,timeLeft:0,timerOn:false,timerDone:false,iv:null};render();}
function startRest(){const ex=S.day.exercises[S.exIdx];if(!ex.rest||ex.isStretch){advance();return;}go({screen:'rest'});if(S.iv)clearInterval(S.iv);S.timeLeft=ex.rest;S.timerOn=true;S.timerDone=false;S.iv=setInterval(()=>{if(S.timeLeft>0){S.timeLeft--;render();}else{clearInterval(S.iv);S.timerOn=false;S.timerDone=true;render();}},1000);}
function advance(){if(S.iv)clearInterval(S.iv);const ex=S.day.exercises[S.exIdx];const ls=S.setNum>=ex.sets,le=S.exIdx>=S.day.exercises.length-1;if(ls){if(le)go({screen:'complete',timerOn:false,timerDone:false});else go({screen:'exercise',exIdx:S.exIdx+1,setNum:1,timerOn:false,timerDone:false});}else{go({screen:'exercise',setNum:S.setNum+1,timerOn:false,timerDone:false});}}
function skipRest(){clearInterval(S.iv);S.timerOn=false;advance();}

function weightBox(n,ac){
  const w=calcWeight(n,currentWeek);if(!w)return'';
  let r='';
  if(w.type==='bodyweight')r=`<div class="wc-suggest"><span class="wc-bw">Bodyweight</span><span class="wc-unit" style="margin-left:.3rem">— focus on rep quality</span></div>`;
  else if(w.type==='stretch')return'';
  else{const atM=w.weight>=w.max;r=`<div class="wc-suggest"><span class="wc-suggest-label">Suggested&nbsp;</span><span class="wc-weight">${w.weight}</span><span class="wc-unit">&nbsp;${w.unit}</span>${atM?'<span class="wc-max">· max reached</span>':''}</div>`;}
  return`<div class="wc-box"><div class="wc-week-group"><span class="wc-week-label">Week</span><button class="wc-btn" onclick="adjWeek(-1)">−</button><span class="wc-weeknum" style="color:${ac}">${currentWeek}</span><button class="wc-btn" onclick="adjWeek(1)">+</button></div><span class="wc-arrow">→</span>${r}</div>`;
}

function imgHTML(ex){
  const url = GIFS[ex.name];
  const bg=`background:linear-gradient(135deg,${ex.color}22,${ex.color}44)`;
  const fb=`<div class="ex-fallback-icon">${ex.icon}</div><div class="ex-fallback-lbl" style="color:${ex.color}">${ex.muscle}</div>`;
  if(url){
    return `<div class="ex-img-wrap" style="${bg}">
      <img class="ex-img" src="${url}" alt="${ex.name}"
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="ex-fallback" style="display:none;${bg}">${fb}</div>
    </div>`;
  }
  return `<div class="ex-img-wrap" style="${bg}"><div class="ex-fallback" style="display:flex;${bg}">${fb}</div></div>`;
}

function badges(ex){let h='';(ex.badges||[]).forEach(b=>{if(b==='back')h+=`<span class="badge badge-back">BACK MOD</span>`;if(b==='knee')h+=`<span class="badge badge-knee">KNEE MOD</span>`;});if(ex.isKey)h+=`<span class="badge badge-key">KEY EXERCISE</span>`;return h?`<div class="badges">${h}</div>`:'';}

function renderHome(){
  const cards=DAYS.map(d=>`<button class="day-card" style="border-left-color:${d.ac}" onclick="startDay(DAYS[${d.id-1}])"><div class="dc-emoji">${d.emoji}</div><div class="dc-num" style="color:${d.ac}">${d.label}</div><div class="dc-name">${d.name}</div><div class="dc-count">${d.type==='rest'?'Full rest day':d.type==='yoga'?`${d.yoga.length} poses`:d.treadmill?`49 min treadmill + ${d.exercises.length} finishers`:`${d.exercises.length} exercises`}</div></button>`).join('');
  return`<div class="home-hero"><div class="home-tag">Your Workout Plan</div><div class="home-h1">ASAD'S <span>6-DAY</span> PROGRAM</div><div class="home-meta">50 yrs · 80–85 kg · Muscle & Strength · Knee + Back modified</div><div class="home-week-bar"><span class="hw-label">Current Week</span><div class="hw-stepper"><button class="hw-btn" onclick="adjWeek(-1)">−</button><span class="hw-num">${currentWeek}</span><button class="hw-btn" onclick="adjWeek(1)">+</button></div><span class="hw-tip">Used across all exercises</span></div></div><div class="days-grid">${cards}</div>`;
}
function renderWarmup(){const d=S.day;return`<div class="hdr"><button class="hdr-back" onclick="go({screen:'home'})">←</button><span style="font-size:1.1rem">${d.emoji}</span><div><div class="hdr-title">${d.name}</div><div class="hdr-sub">${d.label} · Week ${currentWeek}</div></div></div><div class="scroll"><div class="center-screen"><div class="big-icon">🏃</div><div class="screen-h2">Warm-Up First</div><div class="screen-p">${d.warmup}</div><button class="btn btn-primary" style="background:${d.ac};max-width:260px" onclick="go({screen:'exercise'})">Let's Go →</button></div></div>`;}
function renderTreadmill(){const d=S.day;const rows=d.treadmill.map(p=>`<div class="tread-row" style="background:${p.full?'#1a1000':'#111827'};border-left-color:${p.full?d.ac:'#374151'}"><span style="font-size:1rem">${p.full?'🔥':'🚶'}</span><div style="flex:1"><div class="tread-phase" style="color:${p.full?d.ac:'#94a3b8'}">${p.phase}</div><div class="tread-detail">${p.speed} · ${p.incline} incline</div></div><div class="tread-dur">${p.dur}</div></div>`).join('');return`<div class="hdr"><button class="hdr-back" onclick="go({screen:'home'})">←</button><span style="font-size:1.1rem">${d.emoji}</span><div><div class="hdr-title">${d.name}</div></div></div><div class="scroll"><div class="section-hd">Treadmill Routine</div><div class="section-sub">Complete all intervals, then start the finisher</div><div class="tread-list">${rows}</div><div style="padding:.75rem"><button class="btn btn-primary" style="background:${d.ac}" onclick="go({screen:'exercise'})">Treadmill Done — Start Finisher →</button></div></div>`;}
function renderExercise(){
  const d=S.day,ex=d.exercises[S.exIdx];
  const total=d.exercises.length,idx=S.exIdx,pct=Math.round((idx/total)*100);
  let tag='';if(ex.isFinisher)tag=`<span class="ex-tag" style="color:${d.ac}">Finisher</span>`;if(ex.isSuperset)tag=`<span class="ex-tag" style="color:#7c3aed">Superset</span>`;
  let bars='';for(let i=0;i<ex.sets;i++)bars+=`<div class="set-pip" style="${i<S.setNum?'background:'+d.ac:''}"></div>`;
  return`<div class="hdr"><button class="hdr-back" onclick="go({screen:'home'})">←</button><span style="font-size:1rem">${d.emoji}</span><div style="flex:1;min-width:0"><div class="hdr-title">${d.name}</div><div class="hdr-sub">Exercise ${idx+1}/${total} · Week ${currentWeek}</div></div><div style="font-size:.65rem;color:var(--muted)">${pct}%</div></div>
  <div class="prog"><div class="prog-fill" style="width:${Math.max(3,pct)}%;background:${d.ac}"></div></div>
  <div class="scroll">${imgHTML(ex)}<div class="ex-body">${tag}
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;margin-bottom:3px">
      <div class="ex-name" style="flex:1">${ex.name}</div>
      <div class="reps-box"><div class="reps-val" style="color:${d.ac}">${ex.reps}</div><div class="reps-lbl">REPS</div></div>
    </div>
    ${weightBox(ex.name,d.ac)}<div class="ex-muscles">${ex.muscles}</div>${badges(ex)}
    <div class="ex-instr">${ex.instr}</div>
    <div class="sets-hd"><span class="sets-lbl">Sets</span><span class="sets-val" style="color:${d.ac}">${S.setNum} / ${ex.sets}</span></div>
    <div class="set-bars">${bars}</div>
    <div class="ex-meta"><span>Exercise ${idx+1} of ${total}</span><span>Rest: ${ex.rest}s</span></div>
    <button class="btn btn-primary" style="background:${d.ac}" onclick="startRest()">${ex.isStretch?'Done — Next →':`Set ${S.setNum} Done — Start Rest Timer →`}</button>
    ${idx>0?`<button class="btn btn-ghost" onclick="go({screen:'exercise',exIdx:${idx-1},setNum:1})">← Previous</button>`:''}
  </div></div>`;
}
function renderRest(){
  const d=S.day,ex=d.exercises[S.exIdx];
  const max=ex.rest||60,pct=max>0?Math.round(((max-S.timeLeft)/max)*100):100;
  const r=54,circ=2*Math.PI*r,offset=circ-((pct/100)*circ);
  const ls=S.setNum>=ex.sets,le=S.exIdx>=d.exercises.length-1;
  const nm=ls?(le?'Last exercise — great work!':`Up next: ${d.exercises[S.exIdx+1].name}`):`${ex.reps} reps · Set ${S.setNum+1} of ${ex.sets}`;
  const bl=ls&&le?'Finish Workout 🎉':ls?'Next Exercise →':`Start Set ${S.setNum+1} →`;
  return`<div class="hdr"><button class="hdr-back" onclick="go({screen:'exercise'})">←</button><span>${d.emoji}</span><div><div class="hdr-title">Rest Timer</div><div class="hdr-sub">${d.name}</div></div></div>
  <div class="scroll"><div class="rest-wrap">
    <div class="rest-lbl">${ls?'Last set done!':'Set '+S.setNum+' done'}</div><div class="rest-ex" style="color:${d.ac}">${ex.name}</div>
    <svg width="136" height="136" style="margin:.4rem 0">
      <circle cx="68" cy="68" r="${r}" fill="none" stroke="#1e2d3d" stroke-width="9"/>
      <circle cx="68" cy="68" r="${r}" fill="none" stroke="${d.ac}" stroke-width="9" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 68 68)"/>
      <text x="68" y="62" text-anchor="middle" fill="#e2e8f0" font-size="28" font-weight="800" font-family="inherit">${fmt(S.timeLeft)}</text>
      <text x="68" y="80" text-anchor="middle" fill="#64748b" font-size="11" font-family="inherit">REST</text>
    </svg>
    <div class="rest-next">${nm}</div>
    ${S.timerDone||S.timeLeft===0?`<button class="btn btn-primary" style="background:${d.ac};max-width:300px" onclick="advance()">${bl}</button>`:`<button class="btn btn-ghost" style="max-width:300px" id="skipBtn">Skip Rest →</button>`}
  </div></div>`;
}
function renderYoga(){const d=S.day;const cards=d.yoga.map(p=>`<div class="yoga-card" style="border-left-color:${d.ac}"><div style="display:flex;align-items:center;gap:.7rem;margin-bottom:.35rem"><span style="font-size:1.3rem">${p.icon}</span><div><div class="yoga-focus" style="color:${d.ac}">${p.focus}</div><div class="yoga-name">${p.name}</div><div class="yoga-dur">${p.dur}</div></div></div><div class="yoga-instr">${p.instr}</div></div>`).join('');return`<div class="hdr"><button class="hdr-back" onclick="go({screen:'home'})">←</button><span>${d.emoji}</span><div><div class="hdr-title">${d.name}</div></div></div><div class="scroll"><div class="section-hd">Yoga Session</div><div style="background:#111827;border-radius:9px;margin:.2rem .7rem .5rem;padding:.7rem .85rem;border-left:3px solid ${d.ac};font-size:.75rem;color:var(--muted)"><strong style="color:${d.ac}">Recommended:</strong> "Yoga with Adriene — Yoga for Back Pain" on YouTube.</div>${cards}<div style="padding:.7rem"><button class="btn btn-primary" style="background:${d.ac}" onclick="go({screen:'home'})">Done — Great Work 🧘</button></div></div>`;}
function renderRestDay(){return`<div class="hdr"><button class="hdr-back" onclick="go({screen:'home'})">←</button><span>🌙</span><div><div class="hdr-title">Full Rest</div></div></div><div class="scroll"><div class="center-screen"><div class="big-icon">🌙</div><div class="screen-h2">Full Rest Day</div><div class="screen-p">Muscles grow during recovery. This day is not optional.</div><div class="rest-day-tips">${['7–8 hours sleep','130–170g protein today','2.5–3L water','Light walk OK — no gym'].map(t=>`<div class="tip-row"><span class="tip-check">✓</span><span class="tip-txt">${t}</span></div>`).join('')}</div><button class="btn btn-ghost" style="max-width:220px" onclick="go({screen:'home'})">← Back to Schedule</button></div></div>`;}
function renderComplete(){const d=S.day,ts=d.exercises.reduce((s,e)=>s+e.sets,0);return`<div class="hdr"><button class="hdr-back" onclick="go({screen:'home'})">←</button><span>${d.emoji}</span><div><div class="hdr-title">Workout Complete!</div></div></div><div class="scroll"><div class="complete-wrap"><div class="big-icon">🏆</div><div class="screen-h2">Day Complete!</div><div style="color:${d.ac};font-size:.95rem;font-weight:700">${d.name}</div><div class="stats-row"><div class="stat-box"><div class="stat-n" style="color:${d.ac}">${d.exercises.length}</div><div class="stat-l">Exercises</div></div><div class="stat-box"><div class="stat-n" style="color:${d.ac}">${ts}</div><div class="stat-l">Sets</div></div></div>${d.cooldown?`<div class="cooldown-box"><div class="cooldown-tag">Cool-Down</div><div class="cooldown-txt">${d.cooldown}</div></div>`:''}<button class="btn btn-primary" style="background:${d.ac};max-width:300px" onclick="go({screen:'home'})">Back to Schedule</button></div></div>`;}

function render(){
  const m=document.getElementById('main');if(!m)return;
  const fns={home:renderHome,warmup:renderWarmup,treadmill:renderTreadmill,exercise:renderExercise,rest:renderRest,yoga:renderYoga,restday:renderRestDay,complete:renderComplete};
  m.innerHTML=fns[S.screen]?fns[S.screen]():'';
  const skip=document.getElementById('skipBtn');if(skip)skip.onclick=skipRest;
}
render();
</script>
